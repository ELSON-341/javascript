<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aalisador de Números</title>
</head>
<body>
    <header>
        <h1>Aalisador de Números</h1>
    </header>
    <main>
        <section>
            <label for="num-txt">Números (entre 1 e 100)</label>
            <input type="number" name="num-txt" id="num-txt" min="1" max="100">
            <button type="button" onclick="add()">Adicionar</button>
        </section>
        <section>
            <select size="10" id="sel">
                <option value="test" disabled>Digite um número acima</option>
            </select>
            <br>
            <button type="button" onclick="toAnalyze()">Finalizar</button>
        </section>
        <section id="res">
            
        </section>
    </main>
    <footer>
        <p>&copy; Curso em Vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
