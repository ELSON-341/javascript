<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Modelo de Execício</title>
</head>
<body>
    <header>
        <h1>Hora do dia</h1>
    </header>
    <section>
        <div>
            <p>
                <label for="txt-ini">Início: </label>
                <input type="number" name="txt-ini" id="txt-ini" required min="0" max="10" step="0.1">
            </p>
            <p>
                <label for="txt-fim">Fim: </label>
                <input type="number" name="txt-fim" id="txt-fim" required max="10" step="0.1">
            </p>
            <p>
                <label for="txt-pas">Passo: </label>
                <input type="number" name="txt-pas" id="txt-pas" required min="0" max="5">
            </p>
            <button type="button" onclick="counter()">Contar</button>
        </div>
        <div id="res">

        </div>
    </section>
    <footer>
        <p>&copy; Curso em Vídeo</p>
    </footer>
</body>
</html>
