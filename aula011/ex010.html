<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    <label for="textvel">Volocidade do carro: </label>
    <input type="number" name="textvel" id="textvel"> km/h
    <input type="button" value="Verificar" onclick="calculate()">
    <div id="res">
        
    </div>
    <script>
        const calculate = () => {
            const textv = window.document.getElementById('textvel')
            const res = window.document.querySelector('div#res')
            const vel = Number(textv.value)
            res.innerHTML = `Sua velocidade atul é de <strong>${vel}km/h</strong>`
            if (vel > 60) {
                res.innerHTML += `<p>Você está <strong>MULTADO</strong> por excesso de velocidade.</p>`
            }
            res.innerHTML += `<p>Dirija sempre com cinto de segurança!</p>`
        }
    </script>
</body>
</html>
