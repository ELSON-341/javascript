<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        body {
            font: normal 18pt Arial;
        }

        input {
            font: normal 18pt Arial;
        }

        div#res {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number" name="textn1" id="txtn1"> +
    <input type="number" name="textn2" id="txtn2"> 
    <input type="button" value="Somar" onclick="soma()">
    <div id="res"></div>
    <script>
        function soma() {
            const tn1 = document.getElementById('txtn1')
            const tn2 = document.querySelector('input[name="textn2"]')
            const res = document.getElementById('res')

            const n1 = Number(tn1.value)
            const n2 = Number(tn2.value)
            const s = n1 + n2
            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong style="color: red;">${s}</strong>`
        }
    </script>
</body>
</html>
